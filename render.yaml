services:
  - type: web
    name: dotmuted-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m backend.run
    healthCheckPath: /health
    envVars:
      - key: B_BACKEND
        value: neon
      - key: B_AUTO_MIGRATE
        value: true
      - key: B_DB_POOL_MIN_SIZE
        value: 1
      - key: B_DB_POOL_MAX_SIZE
        value: 5
      - key: B_CORS_ORIGINS
        sync: false
      - key: B_NEON_DB_URL
        sync: false
      - key: B_NEON_DB_PASS
        sync: false