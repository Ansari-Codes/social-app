name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      F_APP_NAME: ${{ vars.F_APP_NAME }}
      F_BACKEND_URL: ${{ vars.F_BACKEND_URL }}
      F_BASE_PATH: ${{ vars.F_BASE_PATH }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify API URL
        run: |
          if [ -z "$F_BASE_PATH" ]; then
            echo "::error::Set the F_BASE_PATH repository variable to / for a root/custom domain site or /repository-name/ for a project site."
            exit 1
          fi
          case "$F_BACKEND_URL" in
            https://*) ;;
            *) echo "::error::Set the F_BACKEND_URL repository variable to the HTTPS Render API origin."; exit 1 ;;
          esac
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4